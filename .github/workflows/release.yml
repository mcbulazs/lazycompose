name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build
        # lazycompose -update and install.sh depend on these names
        run: |
          mkdir dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              bin=lazycompose
              [ "$os" = windows ] && bin=lazycompose.exe
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
                -o "$bin" ./cmd/lazycompose
              name=lazycompose_${os}_$arch
              if [ "$os" = windows ]; then
                zip -q "dist/$name.zip" "$bin" README.md LICENSE
              else
                tar -czf "dist/$name.tar.gz" "$bin" README.md LICENSE
              fi
              rm "$bin"
            done
          done
          cd dist && sha256sum *.tar.gz *.zip > checksums.txt
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
