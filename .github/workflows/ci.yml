name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # keep LF line endings, the test fixtures are compared byte for byte
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o lazycompose-ci ./cmd/lazycompose
        env:
          CGO_ENABLED: "0"
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh docs/screenshot/make.sh
