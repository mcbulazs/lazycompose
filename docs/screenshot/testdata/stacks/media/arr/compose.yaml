name: shot-arr
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0
    command: sleep infinity
    ports: ["8989:8989"]
  radarr:
    image: lscr.io/linuxserver/radarr:5.14
    command: sleep infinity
    ports: ["7878:7878"]
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:1.25
    command: sh -c 'echo "[Fatal] database is locked"; exit 1'
